<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen 4</title>
    <script src="examen4.js" ></script>
</head>
<body>
    <h1 id="hola">Hola, introduce tu nombre aquí.</h1>
    <input type="text" id="nombre"><button id="getNombre">Enviar</button>

    <div><h2>Construye tú bicicleta</h2>
        <p>¿Necesita un cuerpo? <br>
        <label for="true">Verdadero</label>
        <input type="radio" id="true" name="cuerpo" value="true">

        <label for="false">Falso</label>
        <input type="radio" id="false" name="cuerpo" value="false">
        </p>

        <p>¿Cuantas ruedas necesita?<br>
        <label for="cero">0. Cero</label>
        <input type="radio" id="cero" name="rueda" value=0><br>

        <label for="una">1. Una</label>
        <input type="radio" id="una" name="rueda" value=1><br>

        <label for="dos">2. Dos</label>
        <input type="radio" id="dos" name="rueda" value=2><br>
        </p>

        <p>¿Necesita un manillar? <br>
        <label for="true">Verdadero</label>
        <input type="radio" id="true" name="manillar" value="true">

        <label for="false">Falso</label>
        <input type="radio" id="false" name="manillar" value="false">
        </p>

        <p>¿Necesita frenos? <br>
        <label for="true">Verdadero</label>
        <input type="radio" id="true" name="frenos" value="true">

        <label for="false">Falso</label>
        <input type="radio" id="false" name="frenos" value="false">
        </p>
        <button id="encuesta">Crear</button>

        <p id="output"></p>


    </div>
    

    
</body>
</html>
