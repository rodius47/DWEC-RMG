<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego sencillo para el examen de la unidad 3</title>
</head>
<body style="background-color: bisque;">
    <!-- Creación del perfil del jugador -->
    <div>
        <label for="nombre">Nombre de Usuario:</label>
        <input type="text" id="nombre" name="nombre">
    </div>

    <br>

    <div>
        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
        <!-- date se encarga directamente de que la fecha sea menor o igual a hoy -->
    </div>
    <br>
    <button onclick="validarPerfil()">Crear Perfil</button>

    <p id="mensaje" class="mensaje"></p>
    
    <script>

        // Creacion de funcion validar perfil
        function validarPerfil(){

             //Todas las constantes que se usan en la pantalla de inicio de sesion
            const nombre = document.getElementById("nombre").value.trim();
            const fecha = document.getElementById("fechaNacimiento").value;
            const mensaje = document.getElementById("mensaje");
            const edadMinima = 18;

            if(!fecha || !nombre){
                mensajeError("Se necesitan los dos campos, Usuario y Fecha de Nacimiento >= 18 años");
                return;
                // alert("Error dos campos");
            }
        }

        // Funcion de mensaje de error
        function mensajeError(msg){
            const mensaje = document.getElementById("mensaje");
            mensaje.textContent = msg;
        }
    </script>
</body>
</html>
