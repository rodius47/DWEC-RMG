<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego sencillo para el examen de la unidad 3</title>
    <style>
        body {
            background-color: bisque;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .mensaje {
            font-weight: bold;
            color: red;
        }
        #infoJugador {
            margin-top: 20px;
        }
        /* Estilos para la tabla */
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
            background-color: white;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #ddd;
            font-weight: bold;
        }
    </style>

    <script>
        window.onload = function () {
            // --- 1. FUNCIONES UTILIDADES ---
            function getCookie(name) {
                let matches = document.cookie.match(new RegExp(
                    "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
                ));
                return matches ? decodeURIComponent(matches[1]) : undefined;
            }

            function mensajeFinal(msg) {
                const mensaje = document.getElementById("mensaje");
                mensaje.textContent = msg;
            }

            // --- 2. CARGA DE COOKIES E INTERFAZ INICIAL ---
            let userName = getCookie("user");
            let userFecha = getCookie("fechaNacimiento"); 
            let fondo = getCookie("fondo");
            let puntuacion = getCookie("puntuacion");
            let historialCookie = getCookie("historial") || "";

            if (fondo) {
                document.body.style.backgroundColor = fondo;
            }

            const nombrInput = document.getElementById("nombre");
            if (userName && nombrInput) {
                nombrInput.value = userName;
            }

            const fechaInput = document.getElementById("fechaNacimiento");
            if (userFecha && fechaInput) {
                fechaInput.value = userFecha;
            }

            // --- Construcción de la tabla MULTI-FILA desde la cookie ---
            const infoJugador = document.getElementById("infoJugador");
            
            if (historialCookie) {
                let tablaHTML = `
                    <h3>Historial del Jugador</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Puntuación</th>
                                <th>Partida</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                let filasPartidas = historialCookie.split("|");
                
                filasPartidas.forEach(function(filaTexto) {
                    if (filaTexto.trim() !== "") {
                        let columnas = filaTexto.split(",");
                        tablaHTML += `
                            <tr>
                                <td>${columnas[0]}</td>
                                <td>${columnas[1]}</td>
                                <td>${columnas[2]}</td>
                            </tr>
                        `;
                    }
                });

                tablaHTML += `
                        </tbody>
                    </table>
                `;
                infoJugador.innerHTML = tablaHTML;
            }

            // --- 3. MANEJO DEL EVENTO DE VALIDACIÓN ---
            const validarBtn = document.getElementById('validar');

            validarBtn.addEventListener("click", function() {
                const nombre = document.getElementById("nombre").value.trim();
                const fecha = document.getElementById("fechaNacimiento").value;

                if (!fecha || !nombre) {
                    mensajeFinal("Se necesitan los dos campos: Usuario y Fecha de Nacimiento.");
                    return;
                }

                // Cálculo de edad
                const fechaDate = new Date(fecha);
                const fechaActual = new Date();
                fechaActual.setHours(0, 0, 0, 0);

                if (fechaDate > fechaActual) {
                    mensajeFinal("Necesita indicar una fecha de nacimiento menor a hoy.");
                    return;
                }

                let edad = fechaActual.getFullYear() - fechaDate.getFullYear();
                const mes = fechaActual.getMonth() - fechaDate.getMonth();

                if (mes < 0 || (mes === 0 && fechaActual.getDate() < fechaDate.getDate())) {
                    edad--; 
                }

                const edadMinima = 18;
                if (edad < edadMinima) {
                    mensajeFinal(`Debes ser mayor de edad (Mínimo ${edadMinima} años).`);
                    return;
                }

                // --- 4. CONTROL DE EDICIÓN DEL NOMBRE DE USUARIO ---
                let nombreUsuarioFinal;

                if (userName && nombre === userName) {
                    nombreUsuarioFinal = userName;
                } else {
                    nombreUsuarioFinal = nombre.replaceAll(" ", "") + "_" + fechaDate.getFullYear();
                }
                
                let nombreBase = nombreUsuarioFinal.split("_")[0];
                let ultimaLetra = nombreBase.slice(-1).toLowerCase();

                if (["a", "e", "i", "o", "u"].includes(ultimaLetra)) {
                    document.body.style.backgroundColor = "lightblue";
                    document.cookie = "fondo=lightblue; path=/";
                    alert("La última letra es una vocal (Fondo Azul).");
                } else {
                    document.body.style.backgroundColor = "lightgreen";
                    document.cookie = "fondo=lightgreen; path=/";
                    alert("La última letra es una consonante (Fondo Verde).");
                }

                alert("Tu nombre de usuario será: " + nombreUsuarioFinal);
                
                // Guardar datos en cookies compartidas
                document.cookie = "user=" + encodeURIComponent(nombreUsuarioFinal) + "; path=/";
                document.cookie = "fechaNacimiento=" + encodeURIComponent(fecha) + "; path=/"; 

                // --- NUEVO: Calcular número de partida independiente por usuario ---
                let partidasDelUsuario = 0;
                
                if (historialCookie) {
                    let filas = historialCookie.split("|");
                    filas.forEach(function(filaTexto) {
                        if (filaTexto.trim() !== "") {
                            let columnas = filaTexto.split(",");
                            // Si el nombre guardado coincide con el que va a jugar ahora, sumamos uno
                            if (columnas[0] === nombreUsuarioFinal) {
                                partidasDelUsuario++;
                            }
                        }
                    });
                }
                
                // La partida actual será el total de veces que ha jugado + 1
                let nuevaPartidaNum = partidasDelUsuario + 1;
                document.cookie = "partida=" + nuevaPartidaNum + "; path=/";

                // SOLUCIÓN AL BUG: Si la cookie puntuacion no existe, usamos 0 en lugar de undefined
                let puntosIniciales = 0; // Cada partida nueva comienza con cero puntos.

                // Guardar la nueva fila en el Historial general
                let nuevaFilaTexto = `${nombreUsuarioFinal},${puntosIniciales},${nuevaPartidaNum}`; 
                
                let nuevoHistorial;
                if (historialCookie) {
                    nuevoHistorial = historialCookie + "|" + nuevaFilaTexto;
                } else {
                    nuevoHistorial = nuevaFilaTexto;
                }
                
                document.cookie = "historial=" + encodeURIComponent(nuevoHistorial) + "; path=/";

                // Reiniciamos la cookie de puntuación individual para la nueva partida activa
                document.cookie = "puntuacion=0; path=/";

                // Una partida nueva empieza en la casilla 0.
                sessionStorage.removeItem("posicion");

                // Redirección
                window.location.href = "juego_iniciado_RMG.html";
            });
        }
    </script>
</head>

<body>
    <!-- Creación del perfil del jugador -->
    <div class="form-group">
        <label for="nombre">Nombre de Usuario:</label>
        <input type="text" id="nombre" name="nombre">
    </div>

    <div class="form-group">
        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
    </div>

    <button id="validar">Crear Perfil</button>

    <p id="mensaje" class="mensaje"></p>
    <div id="infoJugador"></div> 
    <p>Tu mejor puntuación: <span id="record"></span></p>
</body>
</html>
