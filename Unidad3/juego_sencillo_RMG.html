<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego sencillo para el examen de la unidad 3</title>
    <style>
        body{
            background-color: bisque;
            font-family: arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Creación del perfil del jugador -->
    <div>
        <label for="nombre">Nombre de Usuario:</label>
        <input type="text" id="nombre" name="nombre">
    </div>

    <br>

    <div>
        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
        <!-- date se encarga directamente de que la fecha sea menor o igual a hoy -->
    </div>
    <br>
    <button onclick="validarPerfil()">Crear Perfil</button>

    <p id="mensaje" class="mensaje"></p>
    
    <script>

        // Creacion de funcion validar perfil
        function validarPerfil(){

             //Todas las constantes que se usan en la pantalla de inicio de sesion
            const nombre = document.getElementById("nombre").value.trim();
            const fecha = document.getElementById("fechaNacimiento").value;
            const mensaje = document.getElementById("mensaje");
            const edadMinima = 18;
            
            
            //Calculo real de edad
           
            const fechaDate = new Date(fecha);
            const fechaActual = new Date();
            fechaActual.setHours(0, 0, 0, 0);

            let edad = fechaActual.getFullYear() - fechaDate.getFullYear();
            // alert("La edad es: " + typeof(edad));
            alert("La edad es: " + edad +" Fecha insertada "+ fechaDate.getDate()+"/ "+fechaDate.getMonth()+"/ "+ fechaDate.getFullYear()+"/. "+" La fecha actual es "+ fechaActual.getDate()+"/ "+fechaActual.getMonth()+"/ "+ fechaActual.getFullYear()+"/. ");
            const mes = fechaActual.getMonth() - fechaDate.getMonth();

            if(mes < 0 || (mes === 0 && fechaActual.getDate() < fechaDate.getDate())) {
                edad--; // Ajuste de edad por mes
                alert("edad: " + edad);
            }
            

            if(!fecha && !nombre){
                mensajeFinal("Se necesitan los dos campos, Usuario y Fecha de Nacimiento >= 18 años");
                return;
            }else if(!fecha || fechaDate > fechaActual){
                mensajeFinal("Necesita indicar una fecha de nacimiento menor a hoy");
                return;
            }else if(edad < edadMinima){
                mensajeFinal("Debes ser mayor de edad");
                return;
            }else if(!nombre){
                mensajeFinal("Necerita introducir un nombre de Usuario");
                return;
            }else{
                mensajeFinal("Perfil creado, pulse iniciar para jugar");
                let numero = fechaDate.getFullYear();
                let nombreUsuario = nombre.replaceAll(" ", "") + "_" + fechaDate.getFullYear();
                alert("Tu nombre de usuario sera: " + nombreUsuario);
            }
        }

        // Funcion de mensaje de error
        function mensajeFinal(msg){
            const mensaje = document.getElementById("mensaje");
            mensaje.textContent = msg;
        }


    </script>
</body>
</html>
