<!DOCTYPE html>

    <script>

        // --- DISTINCION DE PREGUNTAS ELIMINADAS

        function prepararOpciones(datosPregunta, numeroRuleta) {

            // Obtener la respuesta correcta.
            const indiceCorrecto = datosPregunta.correcta - 1;
            const correcta = datosPregunta.opciones[indiceCorrecto];

            // Obtener las respuestas incorrectas.
            let incorrectas = datosPregunta.opciones.filter(
                (_, indice) => indice !== indiceCorrecto
            );

            // Mezclar las respuestas incorrectas.
            incorrectas.sort(() => Math.random() - 0.5);

            // Eliminar tantas incorrectas como indique la ruleta.
            let incorrectasRestantes = incorrectas.slice(
                numeroRuleta
            );

            // Juntar la correcta con las incorrectas restantes.
            let opcionesFinales = [
                correcta,
                ...incorrectasRestantes
            ];

            // Mezclar para que la correcta no esté siempre en la misma posición.
            opcionesFinales.sort(() => Math.random() - 0.5);

            return {
                opciones: opcionesFinales,
                correcta: opcionesFinales.indexOf(correcta) + 1
            };
        }

        };

        // --- EVENTO DE CARGA DE LA PÁGINA ---
        window.onload = function () {
            let win = window.frames.example;


            // --- VARIABLES GLOBALES ---
            let posicionActual = parseInt(sessionStorage.getItem("posicion") || "0", 10);
            let userName = getCookie("user");
            let fondo = getCookie("fondo");
            let params = `scrollbars=no,resizable=no,status=no,location=no,toolbar=no,menubar=no,width=600,height=400,left=100,top=100`;

            const CASILLAS_TOTALES = 60; // De 0 a 60
            const botonLanzar = document.getElementById("lanzarDados");
            const botonRuleta = document.getElementById("ruleta");
            // Si la ruleta ya se ha utilizado, mostrar el botón como usado
            if (getCookie("ruleta")) {
                botonRuleta.classList.add("usado");
            }



            if (fondo) document.body.style.backgroundColor = fondo;
            document.getElementById("saludo").textContent = "Hola " + (userName || "Jugador");
            document.getElementById("record").textContent = localStorage.getItem("record") || 0;

            alert("Bienvenido a este juego. A continuación se le dirán las reglas de este juego.");
            alert("El juego consiste en sacar la mayor puntuación en el dado para poder ir avanzando hasta completar la partida.");

            // Inicializar el tablero físicamente
            dibujarTablero();

            // --- LÓGICA DEL JUEGO ---

            botonLanzar.addEventListener("click", function () {

                let resultado = Math.floor(Math.random() * 6) + 1;
                document.getElementById("dados").textContent = "Ha salido un: " + resultado;

                posicionActual += resultado;

                if (posicionActual >= CASILLAS_TOTALES) {
                    posicionActual = CASILLAS_TOTALES;
                    document.getElementById("dados").textContent +=
                        " - ¡HAS LLEGADO AL CENTRO!";
                }

                actualizarPosicionJugador(posicionActual);

                // Variable para controlar si se ha aceptado la ruleta
                let ventanaEmergente = null;
                let ruletaAceptada = false;

                // Función que muestra la pregunta
                function procesarPregunta() {

                    let datosPregunta = preguntasCasillas[posicionActual];

                    if (!datosPregunta) return;

                    let mensajePregunta =
                        "CASILLA " + posicionActual + "\n\n" +
                        datosPregunta.q + "\n\n" +
                        datosPregunta.opciones.join("\n") + "\n\n" +
                        "Escribe el número de tu respuesta (1, 2, 3 o 4):";

                    let respuestaUsuario = prompt(mensajePregunta);
                    let respuestaConvertida = parseInt(respuestaUsuario, 10);

                    // Cerrar el popup después de responder
                    if (ventanaEmergente && !ventanaEmergente.closed) {
                        ventanaEmergente.close();
                    }

                    // Marcar la ruleta como utilizada si se aceptó
                    if (ruletaAceptada) {
                        botonRuleta.classList.add("usado");
                    }

                    if (respuestaConvertida === datosPregunta.correcta) {

                        sessionStorage.setItem("posicion", posicionActual);

                        // Actualizar récord
                        let mejorPuntuacion =
                            parseInt(localStorage.getItem("record") || "0", 10);

                        if (posicionActual > mejorPuntuacion) {
                            localStorage.setItem("record", posicionActual);
                            document.getElementById("record").textContent = posicionActual;
                        }

                        alert("¡Correcto! Continúas en el juego.");

                        document.cookie = "puntuacion=" + posicionActual + "; path=/";

                        // Actualizar historial
                        let historialActual = getCookie("historial") || "";
                        let filasHistorial = historialActual.split("|");
                        let ultimaFila = filasHistorial.length - 1;

                        if (filasHistorial[ultimaFila]) {
                            let datosUltimaFila = filasHistorial[ultimaFila].split(",");
                            datosUltimaFila[1] = posicionActual;
                            filasHistorial[ultimaFila] = datosUltimaFila.join(",");

                            document.cookie = "historial=" +
                                encodeURIComponent(filasHistorial.join("|")) + "; path=/";
                        }

                        if (posicionActual === CASILLAS_TOTALES) {
                            alert("¡Felicidades, dominas JavaScript y ganaste la partida!");
                            sessionStorage.removeItem("posicion");
                            document.cookie = "ruleta=; max-age=0; path=/";
                        }

                    } else {

                        alert("Incorrecto o cancelado. Perdiste.");

                        sessionStorage.removeItem("posicion");

                        document.cookie = "ruleta=; max-age=0; path=/";

                        window.location.href = "juego_sencillo_RMG.html";
                    }
                }

                // Comprobar si la ruleta ya se ha utilizado
                if (getCookie("ruleta")) {

                    botonRuleta.classList.add("usado");

                    // Si ya se utilizó, mostrar directamente la pregunta
                    procesarPregunta();

                } else {

                    // Escuchar el mensaje que envía el popup
                    function recibirMensaje(event) {

                        // Comprobar que el mensaje procede de nuestro popup
                        if (event.source !== ventanaEmergente) return;

                        if (event.data === "ruleta-aceptada") {

                            ruletaAceptada = true;

                            // Guardar que se ha utilizado la ruleta
                            document.cookie = "ruleta=usado; path=/";

                            window.removeEventListener("message", recibirMensaje);

                            procesarPregunta();

                        } else if (event.data === "ruleta-rechazada") {

                            window.removeEventListener("message", recibirMensaje);

                            procesarPregunta();
                        }
                    }

                    window.addEventListener("message", recibirMensaje);

                    // Abrir el popup
                    ventanaEmergente = window.open(
                        "comodinRuleta.html",
                        "comodinRuleta",
                        params
                    );

                    // Si el navegador bloquea el popup
                    if (!ventanaEmergente) {
                        window.removeEventListener("message", recibirMensaje);
                        procesarPregunta();
                    }
                }

            });



            // --- FUNCIONES DEL TABLERO ---
            function generarMatrizEspiral(n) {
                let matriz = Array(n).fill().map(() => Array(n).fill(-1));
                let num = 0;
                let top = 0, bottom = n - 1;
                let left = 0, right = n - 1;

                while (num <= CASILLAS_TOTALES) {
                    // Fila superior (Izquierda a Derecha)
                    for (let i = left; i <= right && num <= CASILLAS_TOTALES; i++) matriz[top][i] = num++;
                    top++;
                    // Columna derecha (Arriba a Abajo)
                    for (let i = top; i <= bottom && num <= CASILLAS_TOTALES; i++) matriz[i][right] = num++;
                    right--;
                    // Fila inferior (Derecha a Izquierda)
                    for (let i = right; i >= left && num <= CASILLAS_TOTALES; i--) matriz[bottom][i] = num++;
                    bottom--;
                    // Columna izquierda (Abajo a Arriba)
                    for (let i = bottom; i >= top && num <= CASILLAS_TOTALES; i--) matriz[i][left] = num++;
                    left++;
                }
                return matriz;
            }

            function dibujarTablero() {
                const tamaño = 9;
                const matriz = generarMatrizEspiral(tamaño);
                const contenedor = document.getElementById("tablero");
                contenedor.innerHTML = ""; // Limpiar contenedor por seguridad

                for (let i = 0; i < tamaño; i++) {
                    for (let j = 0; j < tamaño; j++) {
                        let valor = matriz[i][j];

                        if (valor !== -1) {
                            let div = document.createElement("div");
                            div.className = "casilla";
                            div.id = "casilla-" + valor;
                            div.setAttribute("data-num", valor);
                            div.textContent = valor;
                            contenedor.appendChild(div);
                        } else {
                            let divVacio = document.createElement("div");
                            contenedor.appendChild(divVacio);
                        }
                    }
                }
                // Pintar la posición guardada en esta sesión
                actualizarPosicionJugador(posicionActual);
            }

            function actualizarPosicionJugador(nuevaPosicion) {
                let anterior = document.querySelector(".casilla.jugador");
                if (anterior) {
                    anterior.classList.remove("jugador");
                }

                let nuevaCasilla = document.getElementById("casilla-" + nuevaPosicion);
                if (nuevaCasilla) {
                    nuevaCasilla.classList.add("jugador");
                }
            }

            // --- UTILIDADES ---
            function getCookie(name) {
                let matches = document.cookie.match(new RegExp(
                    "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
                ));
                return matches ? decodeURIComponent(matches[1]) : undefined;
            }
        };


    </script>
